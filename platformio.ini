[env]
extra_scripts = pre:scripts/build_hash.py

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags =
    -DF_CPU=16000000UL
    -DBAUD_RATE=115200
    -Os
    -Wall
    -ffunction-sections
    -fdata-sections
build_src_filter = +<*>
build_type = release
upload_speed = 115200
monitor_speed = 115200

; Static stack measurement (STK, CNC-029 Ola 3). Measurement-only build; `uno`
; and `nano` are untouched. -fstack-usage writes one .su file per translation
; unit; LTO is disabled because GCC emits empty .su files when LTO is on (the
; frames are only finalized in the LTRANS stage). Consequence: the static numbers
; come from a non-LTO build, so they are an estimate to be checked against the
; `pk=` of the bench. Gate and rationale: doc/known-issues.md, section 4c.
[env:uno_stack]
extends = env:uno
build_flags = ${env:uno.build_flags} -fstack-usage
build_unflags = -flto

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
; No debug keep-alive on the Nano: optiboot leaves ~30 KB of flash and the
; [DBG:...] diagnostics are not worth ~784 B of that margin (774 B of the
; keep-alive plus 10 B for up=? in the boot banner; only the UNO keeps them).
; See DEBUG_KEEPALIVE in src/config.h.
build_flags =
    -DF_CPU=16000000UL
    -DBAUD_RATE=115200
    -Os
    -Wall
    -ffunction-sections
    -fdata-sections
    -D DISABLE_DEBUG_KEEPALIVE
build_src_filter = +<*>
build_type = release
upload_speed = 57600
monitor_speed = 115200
