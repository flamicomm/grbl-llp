[env]
extra_scripts = pre:scripts/build_hash.py

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags =
    -DF_CPU=16000000UL
    -DBAUD_RATE=115200
    -Os
    -Wall
    -ffunction-sections
    -fdata-sections
build_src_filter = +<*>
build_type = release
upload_speed = 115200
monitor_speed = 115200

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
; No debug keep-alive on the Nano: optiboot leaves ~30 KB of flash and the
; [DBG:...] diagnostics are not worth ~784 B of that margin (774 B of the
; keep-alive plus 10 B for up=? in the boot banner; only the UNO keeps them).
; See DEBUG_KEEPALIVE in src/config.h.
build_flags =
    -DF_CPU=16000000UL
    -DBAUD_RATE=115200
    -Os
    -Wall
    -ffunction-sections
    -fdata-sections
    -D DISABLE_DEBUG_KEEPALIVE
build_src_filter = +<*>
build_type = release
upload_speed = 57600
monitor_speed = 115200
